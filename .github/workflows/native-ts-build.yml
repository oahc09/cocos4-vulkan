# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: <Native> build-native-ts

on: [pull_request]


# github.head_ref is only defined on pull_request events
concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: 
      (! contains(github.event.pull_request.body, '[X] does not change any runtime related code or build configuration'))
    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci --ignore-scripts
    - run: npm run build:debug-infos
    - name: Download external
      run: |
        EXT_VERSION=`node ./.github/workflows/get-native-external-version.js`
        EXT_REPOSITORY=`node ./.github/workflows/get-native-external-version.js --url`
        node native/utils/checkout-deps.js "$EXT_REPOSITORY" "$EXT_VERSION" native/external
    - run: node ./scripts/compile-native-ts.js 
    #- run: echo "::remove-matcher owner=circular-reference-check::"
