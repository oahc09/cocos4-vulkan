<style>
  :root {

    --muted: #9aa7b4;
    --accent: #58a6ff;
    --l0: #f778ba;
    --l1: #ff9f43;
    --l2: #ffd33d;
    --l3: #7ee787;

    --l5: #d2a8ff;
    --code: #c9d1d9;

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;

  header {
    position: sticky; top: 0; z-index: 20;

  header p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  .toolbar { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    cursor: pointer; border: 1px solid var(--border); background: var(--panel2);
    color: var(--text); padding: 5px 12px; border-radius: 6px; font-size: 12.5px;
    transition: .15s; user-select: none;

  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; font-size: 11.5px; color: var(--muted); }

  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  main { padding: 18px 22px 80px; max-width: 1200px; margin: 0 auto; }

  .tree { --indent: 26px; }
  .node { position: relative; }
  .node-children {
    margin-left: var(--indent);
    padding-left: 16px;
    border-left: 1px dashed var(--border);
    overflow: hidden;
    transition: max-height .28s ease;
  }
  .node-children.collapsed { display: none; }

  .card {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 12px;
    margin: 7px 0;
    cursor: pointer;
    transition: .15s;
    position: relative;
  }
  .card:hover { border-color: var(--accent); background: var(--panel2); }
  .card.leaf { cursor: default; }
  .card.leaf:hover { border-color: var(--border); background: var(--panel); }

    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; margin-top: 1px;
    background: #21262d; color: var(--accent); border: 1px solid var(--border);
    transition: transform .2s;

  .card.leaf .toggle { visibility: hidden; }
  .card.expanded .toggle { transform: rotate(90deg); }

  .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 14px; }

  .file {

  .file:hover { text-decoration: underline; }
  .count { font-size: 10.5px; color: var(--muted); }

  .lvl1 > .card { border-left: 4px solid var(--l1); }
  .lvl2 > .card { border-left: 4px solid var(--l2); }
  .lvl3 > .card { border-left: 4px solid var(--l3); }
  .lvl4 > .card { border-left: 4px solid var(--l4); }
  .lvl5 > .card { border-left: 4px solid var(--l5); }

  footer { text-align: center; color: var(--muted); font-size: 11.5px; padding: 20px; }

const LEVEL_CLASS = ["lvl0","lvl1","lvl2","lvl3","lvl4","lvl5"];

function countLeaves(node){
  if(!node.c || !node.c.length) return 1;
  return node.c.reduce((s,ch)=>s+countLeaves(ch),0);
}

function makeNode(node, level){
  const wrap = document.createElement("div");
  wrap.className = "node " + (LEVEL_CLASS[Math.min(level, LEVEL_CLASS.length-1)]);

  const hasChildren = node.c && node.c.length;
  const card = document.createElement("div");
  card.className = "card" + (hasChildren ? "" : " leaf");

  const toggle = document.createElement("div");
  toggle.className = "toggle";
  toggle.textContent = "▶";
  card.appendChild(toggle);

  const body = document.createElement("div");
  body.className = "body";

  const titleRow = document.createElement("div");
  titleRow.className = "title-row";
  const title = document.createElement("span");
  title.className = "title";
  title.textContent = node.t;
  titleRow.appendChild(title);
  if(node.tag){
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = node.tag;
    titleRow.appendChild(tag);
  }
  if(node.code){
    const c = document.createElement("span");
    c.className = "code";
    c.textContent = node.code;
    titleRow.appendChild(c);
  }
  if(hasChildren){
    const cnt = document.createElement("span");
    cnt.className = "count";
    cnt.textContent = "· " + node.c.length + " 项 / " + countLeaves(node) + " 叶";
    titleRow.appendChild(cnt);
  }
  body.appendChild(titleRow);

  if(node.d){
    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = node.d;
    body.appendChild(desc);
  }
  if(node.f){
    const a = document.createElement("a");
    a.className = "file";
    a.href = ROOT + node.f;
    a.textContent = "📄 " + node.f;
    a.addEventListener("click", e => e.stopPropagation());
    body.appendChild(a);
  }
  card.appendChild(body);
  wrap.appendChild(card);

  let childBox = null;
  if(hasChildren){
    childBox = document.createElement("div");
    childBox.className = "node-children collapsed";
    node.c.forEach(ch => childBox.appendChild(makeNode(ch, level+1)));
    wrap.appendChild(childBox);

    card.addEventListener("click", () => {
      const collapsed = childBox.classList.toggle("collapsed");
      card.classList.toggle("expanded", !collapsed);
    });
  }
  return wrap;
}

const tree = document.getElementById("tree");
tree.appendChild(makeNode(DATA, 0));

function setAll(open){
  document.querySelectorAll(".node-children").forEach(el => el.classList.toggle("collapsed", !open));
  document.querySelectorAll(".card").forEach(el => {
    if(!el.classList.contains("leaf")) el.classList.toggle("expanded", open);
  });
}
function expandToDepth(maxDepth){
  setAll(false);
  document.querySelectorAll(".node").forEach(nodeEl => {
    const cls = [...nodeEl.classList].find(c=>c.startsWith("lvl"));
    const depth = cls ? parseInt(cls.slice(3)) : 0;
    if(depth < maxDepth){
      const cb = nodeEl.querySelector(":scope > .node-children");
      const card = nodeEl.querySelector(":scope > .card");
      if(cb){ cb.classList.remove("collapsed"); if(card) card.classList.add("expanded"); }
    }
  });
}

document.getElementById("expandAll").addEventListener("click", ()=>setAll(true));
document.getElementById("collapseAll").addEventListener("click", ()=>{ setAll(false); });
document.getElementById("expandTwo").addEventListener("click", ()=>expandToDepth(2));

// 默认展开第一层
expandToDepth(1);
</script>
